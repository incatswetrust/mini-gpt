server {
    listen 80;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    # The page asks for static/app.js etc. (the same paths the dev server uses).
    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Server-Sent Events: pass every token on at once instead of buffering the reply.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
