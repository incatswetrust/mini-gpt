# docker compose up --build   ->  http://localhost:8080
services:
  api:
    build:
      context: .
      dockerfile: web/Dockerfile.api
    volumes:
      - ./gpt/out:/models/shakespeare:ro   # trained checkpoints: <run>/best.pt
      - ./franko/out:/models/franko:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
